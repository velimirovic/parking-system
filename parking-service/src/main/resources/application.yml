server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: parking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/parking_db}
    username: ${DB_USERNAME:sep}
    password: ${DB_PASSWORD:sep}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
