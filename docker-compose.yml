name: sep

x-db-healthcheck: &db-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  # ---------- Baze ----------
  parking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: ${PARKING_DB_USER}
      POSTGRES_PASSWORD: ${PARKING_DB_PASSWORD}
    ports: ["${PARKING_DB_PORT}:5432"]
    volumes: [parking-db-data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  psp-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: psp_db
      POSTGRES_USER: ${PSP_DB_USER}
      POSTGRES_PASSWORD: ${PSP_DB_PASSWORD}
    ports: ["${PSP_DB_PORT}:5432"]
    volumes: [psp-db-data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  bank-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: ${BANK_DB_USER}
      POSTGRES_PASSWORD: ${BANK_DB_PASSWORD}
    ports: ["${BANK_DB_PORT}:5432"]
    volumes: [bank-db-data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  # ---------- Message broker (interni za PSP) ----------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 40s

  # ---------- Backend servisi ----------
  parking-service:
    build: ./parking-service
    environment:
      DB_URL: jdbc:postgresql://parking-db:5432/parking_db
      DB_USERNAME: ${PARKING_DB_USER}
      DB_PASSWORD: ${PARKING_DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      # Tajne - vrednosti posle ":-" su SAMO za lokalni razvoj (postaviti u .env)
      JWT_SECRET: ${PARKING_JWT_SECRET:-dev-only-parking-jwt-secret-change-me-0123456789}
      # Parking sistem kao klijent PSP-a (podrazumevano demo parking klijent MRC-00042 iz demo podataka PSP-a)
      PSP_URL: http://psp-service:8082
      PSP_MERCHANT_ID: ${PARKING_PSP_MERCHANT_ID:-MRC-00042}
      PSP_API_KEY: ${PARKING_PSP_API_KEY:-sk_test_parking_demo_0000000000000000}
      PSP_SIGNING_SECRET: ${PARKING_PSP_SIGNING_SECRET:-whsec_parking_demo_00000000000000000}
    ports: ["8081:8081"]
    depends_on:
      parking-db: { condition: service_healthy }

  psp-service:
    build: ./psp-service
    environment:
      DB_URL: jdbc:postgresql://psp-db:5432/psp_db
      DB_USERNAME: ${PSP_DB_USER}
      DB_PASSWORD: ${PSP_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:4201
      # Tajne portala - vrednosti posle ":-" su SAMO za lokalni razvoj (postaviti u .env)
      JWT_SECRET: ${PSP_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      APP_ENCRYPTION_KEY: ${PSP_ENCRYPTION_KEY:-ZGV2LW9ubHktYWVzLWtleS1jaGFuZ2UtbWUtMzJieXQ=}
      SUPER_ADMIN_EMAIL: ${PSP_SUPER_ADMIN_EMAIL:-superadmin@sep.rs}
      SUPER_ADMIN_PASSWORD: ${PSP_SUPER_ADMIN_PASSWORD:-SuperAdmin-2026!}
      DEMO_DATA_ENABLED: ${PSP_DEMO_DATA_ENABLED:-true}
      # Checkout kupca i HMAC tajna PSP Core <-> plugin servisi
      CHECKOUT_BASE_URL: ${PSP_CHECKOUT_BASE_URL:-http://localhost:4201}
      PLUGIN_SHARED_SECRET: ${PSP_PLUGIN_SHARED_SECRET:-dev-only-plugin-secret-change-me-0123456789}
    ports: ["8082:8082"]
    depends_on:
      psp-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------- Payment plugin-ovi (zasebni servisi, sema u bazi PSP-a) ----------
  card-plugin:
    build: ./card-plugin
    environment:
      DB_URL: jdbc:postgresql://psp-db:5432/psp_db
      DB_USERNAME: ${PSP_DB_USER}
      DB_PASSWORD: ${PSP_DB_PASSWORD}
      PSP_CORE_URL: http://psp-service:8082
      PLUGIN_PUBLIC_URL: http://card-plugin:9101
      BANK_URL: http://bank-service:8083
      # Tajne - vrednosti posle ":-" su SAMO za lokalni razvoj (postaviti u .env)
      PLUGIN_SHARED_SECRET: ${PSP_PLUGIN_SHARED_SECRET:-dev-only-plugin-secret-change-me-0123456789}
      BANK_PSP_HMAC_SECRET: ${BANK_PSP_HMAC_SECRET:-dev-only-bank-psp-secret-change-me-0123456789}
    ports: ["9101:9101"]
    depends_on:
      psp-db: { condition: service_healthy }

  bank-service:
    build: ./bank-service
    environment:
      DB_URL: jdbc:postgresql://bank-db:5432/bank_db
      DB_USERNAME: ${BANK_DB_USER}
      DB_PASSWORD: ${BANK_DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:4202
      PAYMENT_PAGE_BASE_URL: ${BANK_PAYMENT_PAGE_URL:-http://localhost:4202}
      # Tajne - vrednosti posle ":-" su SAMO za lokalni razvoj (postaviti u .env)
      BANK_PSP_HMAC_SECRET: ${BANK_PSP_HMAC_SECRET:-dev-only-bank-psp-secret-change-me-0123456789}
      CARD_ENCRYPTION_KEY: ${BANK_CARD_ENCRYPTION_KEY:-ZGV2LW9ubHktY2FyZC1rZXktY2hhbmdlLW1lLTMyYnk=}
      CARD_TOKEN_KEY: ${BANK_CARD_TOKEN_KEY:-dev-only-card-token-key-change-me-0123456789}
      DEMO_DATA_ENABLED: ${BANK_DEMO_DATA_ENABLED:-true}
    ports: ["8083:8083"]
    depends_on:
      bank-db: { condition: service_healthy }

  # ---------- Frontendi ----------
  parking-frontend:
    build: ./parking-frontend
    ports: ["4200:80"]
    depends_on: [parking-service]

  psp-frontend:
    build: ./psp-frontend
    ports: ["4201:80"]
    depends_on:
      psp-service: { condition: service_healthy }

  bank-frontend:
    build: ./bank-frontend
    ports: ["4202:80"]
    depends_on: [bank-service]

volumes:
  parking-db-data:
  psp-db-data:
  bank-db-data:
