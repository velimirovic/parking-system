server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: psp-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/psp_db}
    username: ${DB_USERNAME:sep}
    password: ${DB_PASSWORD:sep}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sep}
    password: ${RABBITMQ_PASSWORD:sep}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201}
